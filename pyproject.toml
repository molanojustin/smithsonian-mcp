[project]
name = "smithsonian-mcp"
version = "2.0.1"
description = "A Model Context Protocol (MCP) server that provides AI assistants with access to the Smithsonian Institution's Open Access collections."
readme = "README.md"
requires-python = ">=3.10.0"
authors = [
    {name = "Justin Molano", email = "justinmolano2@gmail.com"}
]
license = {text = "MIT"}
keywords = [
    "mcp",
    "model-context-protocol",
    "smithsonian",
    "museum",
    "api",
    "open-access",
    "collections",
    "ai",
    "llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

# Production dependencies only
dependencies = [
    "fastmcp>=4.0.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.0",
    "python-decouple>=3.8.0",
]

[project.scripts]
smithsonian-mcp = "smithsonian_mcp.main:main"

[project.urls]
Homepage = "https://github.com/molanojustin/smithsonian-mcp"
Repository = "https://github.com/molanojustin/smithsonian-mcp.git"
Issues = "https://github.com/molanojustin/smithsonian-mcp/issues"

# Development dependencies (not published to PyPI)
[dependency-groups]
dev = [
    "black>=23.0.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smithsonian_mcp"]
# Release helper invoked by the npm "version" script; not part of the runtime package.
exclude = ["smithsonian_mcp/write_version.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/smithsonian_mcp",
    "/tests",
    "/README.md",
    "/LICENSE.md",
]

[tool.black]
# Format for the oldest supported Python so the result is the same on every
# interpreter used to run black.
target-version = ["py310"]
